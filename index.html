<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="부산의 공공기관과 기업을 분야별로 찾아보는 진로 탐색 자료">
<title>부산 일자리 지도 — 우리 동네에 이런 일터가 있어요</title>
<style>
/* ── tokens ───────────────────────────────────────────────── */
:root{
  --ground:#F1F3F2;
  --surface:#FFFFFF;
  --surface-2:#E6EBEA;
  --ink:#0E1F24;
  --ink-2:#3D5259;
  --ink-3:#6E858B;
  --line:#D4DBDA;
  --line-2:#BAC5C4;
  --pub:#0E7C86;
  --pub-deep:#08525A;
  --pub-wash:#E1EFF0;
  --biz:#C4442E;
  --biz-deep:#8E2E1E;
  --biz-wash:#F8E8E3;
  --signal:#B4820F;
  --tile-ink:#FFFFFF;
  --shadow-1:0 1px 2px rgba(14,31,36,.06), 0 2px 8px rgba(14,31,36,.05);
  --shadow-2:0 2px 4px rgba(14,31,36,.08), 0 12px 28px rgba(14,31,36,.11);
  --font-sans:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --font-mono:'D2Coding',ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Malgun Gothic',monospace;
  --r:4px;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0A1618;
    --surface:#122225;
    --surface-2:#1A2E32;
    --ink:#E7EDEC;
    --ink-2:#AABFC2;
    --ink-3:#7C9398;
    --line:#22383C;
    --line-2:#2E4A4F;
    --pub:#45BAC1;
    --pub-deep:#9FE0E4;
    --pub-wash:#0E2F32;
    --biz:#F08265;
    --biz-deep:#F7AF9C;
    --biz-wash:#33170F;
    --signal:#DDA83F;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 14px 32px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0A1618;
  --surface:#122225;
  --surface-2:#1A2E32;
  --ink:#E7EDEC;
  --ink-2:#AABFC2;
  --ink-3:#7C9398;
  --line:#22383C;
  --line-2:#2E4A4F;
  --pub:#45BAC1;
  --pub-deep:#9FE0E4;
  --pub-wash:#0E2F32;
  --biz:#F08265;
  --biz-deep:#F7AF9C;
  --biz-wash:#33170F;
  --signal:#DDA83F;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 14px 32px rgba(0,0,0,.4);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
  word-break:keep-all;
}
h1,h2,h3,h4,p,ul,ol{margin:0;}
ul{padding:0;list-style:none;}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
:focus-visible{outline:2.5px solid var(--pub);outline-offset:3px;border-radius:2px;}
img{max-width:100%;display:block;}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}

/* ── masthead ─────────────────────────────────────────────── */
.mast{
  position:sticky;top:0;z-index:40;
  background:var(--ground);
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.mast-in{
  max-width:var(--maxw);margin:0 auto;padding:11px 22px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;text-align:left;}
.brand-mark{
  width:34px;height:34px;flex:none;border-radius:2px;
  background:var(--pub);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1.5px,transparent 1.5px 6px);
  display:grid;place-items:center;
  color:#fff;font-family:var(--font-mono);font-weight:700;font-size:.86rem;letter-spacing:-.04em;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
}
.brand-txt strong{display:block;font-size:1.02rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;}
.brand-txt span{display:block;font-family:var(--font-mono);font-size:.64rem;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase;}
.mast-spacer{flex:1 1 auto;}

.search{
  position:relative;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--line-2);border-radius:2px;
  min-width:240px;flex:0 1 340px;
}
.search:focus-within{border-color:var(--pub);box-shadow:0 0 0 3px color-mix(in srgb,var(--pub) 18%, transparent);}
.search svg{flex:none;margin-left:10px;color:var(--ink-3);}
.search input{
  flex:1;min-width:0;border:none;background:none;color:inherit;
  font:inherit;font-size:.88rem;padding:8px 10px;
}
.search input::placeholder{color:var(--ink-3);}
.search input:focus{outline:none;}
.search-clear{padding:0 10px;color:var(--ink-3);font-size:1.1rem;line-height:1;}
.search-clear:hover{color:var(--ink);}

/* ── crumb ────────────────────────────────────────────────── */
.crumb{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font-family:var(--font-mono);font-size:.74rem;color:var(--ink-3);
  padding:15px 0 0;
}
.crumb button{color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent;}
.crumb button:hover{color:var(--ink);border-bottom-color:var(--line-2);}
.crumb .sep{opacity:.5;}
.crumb .now{color:var(--ink-2);}

/* ── view transition ──────────────────────────────────────── */
.view{padding-bottom:70px;animation:rise .34s cubic-bezier(.2,.7,.3,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){
  .view{animation:none;}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}

/* ── home hero ────────────────────────────────────────────── */
.hero{padding:46px 0 34px;border-bottom:1px solid var(--line);}
.hero h1{
  font-size:clamp(2rem,5.4vw,3.35rem);font-weight:800;letter-spacing:-.035em;
  line-height:1.14;text-wrap:balance;max-width:17ch;margin-bottom:16px;
}
.hero h1 em{font-style:normal;color:var(--pub);}
.hero p{max-width:56ch;color:var(--ink-2);font-size:1.03rem;}
.hero-stats{
  display:flex;gap:0;flex-wrap:wrap;margin-top:28px;
  border-top:1px solid var(--line);
}
.stat{
  flex:1 1 130px;padding:14px 18px 14px 0;
  border-right:1px solid var(--line);
}
.stat:last-child{border-right:none;}
.stat b{
  display:block;font-family:var(--font-mono);font-size:1.85rem;font-weight:700;
  letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;
}
.stat span{font-size:.76rem;color:var(--ink-3);letter-spacing:.02em;}

/* ── sector panels ────────────────────────────────────────── */
.sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:34px 0 0;}
@media (max-width:760px){.sector-grid{grid-template-columns:1fr;}}
.sector{
  position:relative;display:block;width:100%;text-align:left;
  border-radius:3px;overflow:hidden;color:#fff;
  background:var(--sc);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 2px,transparent 2px 15px);
  box-shadow:var(--shadow-1);
  transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s;
}
.sector:hover,.sector:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-2);}
.sector-body{padding:26px 26px 22px;}
.sector .kind{
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.22em;
  text-transform:uppercase;opacity:.7;
}
.sector h2{font-size:2.05rem;font-weight:800;letter-spacing:-.035em;margin:6px 0 9px;line-height:1.1;}
.sector p{font-size:.9rem;line-height:1.6;opacity:.9;max-width:36ch;}
.sector-meta{
  display:flex;align-items:baseline;gap:9px;margin-top:20px;
  font-family:var(--font-mono);font-size:.76rem;letter-spacing:.04em;
}
.sector-meta b{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;}
.sector-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:rgba(0,0,0,.2);}
.sector-strip img{aspect-ratio:4/3;object-fit:cover;width:100%;opacity:.92;}
.sector-go{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 26px;background:rgba(0,0,0,.16);
  font-family:var(--font-mono);font-size:.75rem;letter-spacing:.1em;
}

/* ── major chips (home) ───────────────────────────────────── */
.majors{padding:46px 0 0;}
.majors h3{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;margin-bottom:5px;}
.majors p{color:var(--ink-3);font-size:.87rem;margin-bottom:16px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  display:inline-flex;align-items:baseline;gap:6px;
  padding:6px 12px;border:1px solid var(--line-2);border-radius:2px;
  background:var(--surface);font-size:.84rem;
  transition:border-color .16s, color .16s, background .16s;
}
.chip .n{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-3);}
.chip:hover{border-color:var(--pub);color:var(--pub);}
.chip:hover .n{color:var(--pub);}

/* ── section head ─────────────────────────────────────────── */
.shead{padding:22px 0 26px;}
.shead h2{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;letter-spacing:-.035em;line-height:1.12;text-wrap:balance;}
.shead .rule{height:4px;width:56px;margin:14px 0;background:var(--accent);}
.shead p{max-width:58ch;color:var(--ink-2);font-size:.98rem;}

/* ── category tiles ───────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px;}
.tile{
  position:relative;text-align:left;width:100%;
  border-radius:3px;overflow:hidden;color:#fff;
  background:var(--tc);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 2px,transparent 2px 15px);
  box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;min-height:196px;
  transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s;
}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-2);}
.tile-top{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.tile-no{
  font-family:var(--font-mono);font-size:2.5rem;font-weight:700;
  line-height:.9;letter-spacing:-.05em;opacity:.32;
}
.tile-count{
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;
  background:rgba(0,0,0,.22);padding:3px 8px;border-radius:2px;white-space:nowrap;
}
.tile-body{padding:14px 18px 18px;margin-top:auto;}
.tile-body h3{font-size:1.32rem;font-weight:800;letter-spacing:-.03em;line-height:1.2;}
.tile-body .sub{font-size:.79rem;opacity:.82;margin-top:4px;font-family:var(--font-mono);letter-spacing:.02em;}
.tile-body .mj{
  margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.24);
  font-size:.76rem;opacity:.88;line-height:1.5;
}

/* ── photo strip ──────────────────────────────────────────── */
.strip{
  display:grid;gap:12px;margin:0 0 30px;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
}
.shot{
  border:1px solid var(--line);background:var(--surface);border-radius:3px;overflow:hidden;
  text-align:left;width:100%;transition:border-color .18s, transform .18s;
}
.shot:hover{border-color:var(--accent);transform:translateY(-2px);}
.shot img{aspect-ratio:16/10;object-fit:cover;width:100%;background:var(--surface-2);}
.shot figcaption{
  padding:7px 10px;font-family:var(--font-mono);font-size:.71rem;
  color:var(--ink-2);letter-spacing:.02em;
}
.strip-note{
  font-size:.76rem;color:var(--ink-3);margin:-20px 0 30px;font-family:var(--font-mono);
}

/* ── group heading ────────────────────────────────────────── */
.ghead{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px;flex-wrap:wrap;}
.ghead:first-child{margin-top:0;}
.ghead h3{font-size:1.16rem;font-weight:800;letter-spacing:-.02em;}
.ghead .gnote{font-size:.83rem;color:var(--ink-3);}
.ghead .gline{flex:1;height:1px;background:var(--line);min-width:20px;}

/* ── org cards ────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:4px solid var(--accent);
  border-radius:3px;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-1);
  transition:box-shadow .2s, border-color .2s;
}
.card:hover{box-shadow:var(--shadow-2);}
.card-photo{
  width:100%;padding:0;border:none;background:var(--surface-2);
  border-bottom:1px solid var(--line);position:relative;display:block;cursor:zoom-in;
}
.card-photo img{aspect-ratio:16/9;object-fit:cover;width:100%;}
.card-photo::after{
  content:'⤢';position:absolute;right:7px;bottom:7px;
  width:22px;height:22px;display:grid;place-items:center;
  background:rgba(10,22,24,.66);color:#fff;font-size:.72rem;border-radius:2px;
  opacity:0;transition:opacity .18s;
}
.card-photo:hover::after{opacity:1;}
.card-in{padding:15px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1;}
.card-name{
  font-size:1.06rem;font-weight:800;letter-spacing:-.025em;line-height:1.3;
}
.card-name .abbr{color:var(--ink-3);font-weight:600;font-family:var(--font-mono);font-size:.82rem;}
.card-kind{
  display:inline-block;align-self:flex-start;
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.07em;
  color:var(--accent-ink);background:var(--accent-wash);
  padding:2px 7px;border-radius:2px;
}
.card-do{font-size:.885rem;color:var(--ink-2);line-height:1.6;}
.card-do b{color:var(--ink);font-weight:700;}
.field{border-top:1px dashed var(--line);padding-top:9px;}
.field .flabel{
  font-family:var(--font-mono);font-size:.66rem;letter-spacing:.13em;
  color:var(--ink-3);text-transform:uppercase;display:block;margin-bottom:5px;
}
.mchips{display:flex;flex-wrap:wrap;gap:4px;}
.mchip{
  font-size:.775rem;padding:2.5px 8px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-2);
  border:1px solid transparent;
  transition:background .15s,color .15s,border-color .15s;
}
.mchip:hover{background:var(--accent-wash);color:var(--accent-ink);border-color:var(--accent);}
.addr{
  display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:11px;
  border-top:1px solid var(--line);
  font-family:var(--font-mono);font-size:.79rem;color:var(--ink-2);letter-spacing:.01em;
}
.addr .pin{color:var(--accent);flex:none;}

/* ── search results ───────────────────────────────────────── */
.res-head{padding:20px 0 22px;}
.res-head h2{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;}
.res-head h2 mark{background:none;color:var(--pub);}
.res-head p{color:var(--ink-3);font-size:.88rem;margin-top:5px;font-family:var(--font-mono);}
.res-group{margin-bottom:34px;}
.empty{
  padding:52px 22px;text-align:center;border:1px dashed var(--line-2);border-radius:3px;
  background:var(--surface);
}
.empty b{display:block;font-size:1.1rem;margin-bottom:6px;}
.empty span{color:var(--ink-3);font-size:.9rem;}

/* ── lightbox ─────────────────────────────────────────────── */
.lb{
  position:fixed;inset:0;z-index:90;display:none;
  background:rgba(8,18,20,.9);backdrop-filter:blur(4px);
  place-items:center;padding:26px;
}
.lb[open]{display:grid;}
.lb figure{margin:0;max-width:1000px;width:100%;}
.lb img{width:100%;max-height:78vh;object-fit:contain;border-radius:3px;}
.lb figcaption{
  color:#E7EDEC;text-align:center;padding-top:12px;
  font-family:var(--font-mono);font-size:.82rem;letter-spacing:.04em;
}
.lb-close{
  position:absolute;top:16px;right:20px;color:#E7EDEC;
  font-size:1.6rem;line-height:1;width:38px;height:38px;
  display:grid;place-items:center;border:1px solid rgba(231,237,236,.3);border-radius:2px;
}
.lb-close:hover{background:rgba(231,237,236,.14);}

/* ── footer ───────────────────────────────────────────────── */
.foot{
  border-top:1px solid var(--line);padding:26px 0 44px;margin-top:46px;
  font-size:.79rem;color:var(--ink-3);line-height:1.75;
}
.foot strong{color:var(--ink-2);font-weight:700;}
.foot .srcs{
  margin:9px 0 14px;font-family:var(--font-mono);font-size:.71rem;line-height:1.9;
  padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:2px;
}
.foot .srcs .u{color:var(--ink-2);}
.foot .srcs .dot{padding:0 7px;opacity:.45;}
.foot-link{
  display:inline-block;margin-top:9px;font-family:var(--font-mono);font-size:.74rem;
  letter-spacing:.05em;color:var(--pub);border-bottom:1px solid currentColor;padding-bottom:1px;
}
.foot-link:hover{color:var(--ink);}

/* 사진 출처 표기 */
.shot figcaption .cr{
  display:block;margin-top:3px;font-size:.65rem;color:var(--ink-3);letter-spacing:.02em;
}
.card-cr{
  padding:6px 16px 0;font-family:var(--font-mono);font-size:.65rem;
  color:var(--ink-3);letter-spacing:.02em;
}
.card-cr + .card-in{padding-top:8px;}

/* 출처 화면 */
.srclist{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:2px;margin-bottom:8px;}
.srclist li{
  background:var(--surface);padding:11px 14px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline;
}
.srclist .st{font-size:.9rem;font-weight:600;}
.srclist .su{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-3);}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px;background:var(--surface);}
.srctable{border-collapse:collapse;width:100%;min-width:520px;font-size:.84rem;}
.srctable th,.srctable td{
  text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;
}
.srctable thead th{
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line-2);white-space:nowrap;
}
.srctable tbody tr:last-child td{border-bottom:none;}
.srctable .dim{color:var(--ink-3);font-size:.79rem;}
.srctable .cred{color:var(--ink);font-weight:600;}
.notice{
  margin-top:26px;padding:15px 17px;border-radius:2px;
  background:var(--pub-wash);border-left:4px solid var(--pub);
  font-size:.85rem;color:var(--ink-2);line-height:1.7;
}
.notice b{display:block;color:var(--ink);margin-bottom:3px;font-size:.8rem;}

.backbtn{
  display:inline-flex;align-items:center;gap:7px;margin-top:18px;
  font-family:var(--font-mono);font-size:.78rem;letter-spacing:.06em;
  color:var(--ink-3);border-bottom:1px solid var(--line-2);padding-bottom:2px;
}
.backbtn:hover{color:var(--ink);border-bottom-color:var(--ink-3);}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <button class="brand" id="homeBtn" aria-label="처음으로">
      <span class="brand-mark" aria-hidden="true">BSN</span>
      <span class="brand-txt">
        <strong>부산 일자리 지도</strong>
        <span>Jobs in Busan</span>
      </span>
    </button>
    <span class="mast-spacer"></span>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>

        {n:'한국선원복지고용센터', a:'', do:'<b>선원의 구인·구직 지원 및 복지</b> 증진을 위해 설립된 공직유관단체. 선원법에 따른 국가 위탁 사업을 수행하며 선원 노동 시장을 관리해요.', m:['항해학','기관학','사회복지학','행정학','경영학'], ad:'중구 중앙동'}

/* ═══════════════════════════════════════════════════════════
   인덱스
   ═══════════════════════════════════════════════════════════ */
const catCount = c => c.groups ? c.groups.reduce((n,g)=>n+g.items.length,0) : c.items.length;
const sectorCount = s => s.cats.reduce((n,c)=>n+catCount(c),0);
const catItems = c => c.groups ? c.groups.flatMap(g=>g.items) : c.items;

const RAW = [];
SECTORS.forEach(s => s.cats.forEach(c =>
  catItems(c).forEach(it => RAW.push({it, cat:c, sector:s}))));

/* 원 자료는 '경영'과 '경영학', '토목'과 '토목공학'처럼 같은 전공을 다르게 적은 곳이
   있어요. 카드에는 원문 그대로 두고, 검색과 전공 칩에서만 한 갈래로 묶어요. */
const MAJORS = [...new Set(RAW.flatMap(r => r.it.m))];
const ROOT = new Map();                    // 표기 → 대표(가장 짧은) 이름
MAJORS.forEach(m => {
  let root = m;
  MAJORS.forEach(o => { if(o !== m && m.startsWith(o) && o.length < root.length) root = o; });
  ROOT.set(m, root);
});
const FAMILY = new Map();                  // 대표 이름 → 같은 뿌리의 모든 표기
MAJORS.forEach(m => {
  const r = ROOT.get(m);
  if(!FAMILY.has(r)) FAMILY.set(r, []);
  FAMILY.get(r).push(m);
});
const FREQ = new Map();
RAW.forEach(r => r.it.m.forEach(m => FREQ.set(m, (FREQ.get(m)||0)+1)));
const LABEL = new Map();                   // 대표 이름 → 화면에 보여줄 표기(가장 흔한 쪽)
FAMILY.forEach((members, root) =>
  LABEL.set(root, [...members].sort((a,b) => (FREQ.get(b)-FREQ.get(a)) || b.length-a.length)[0]));
const labelOf = root => LABEL.get(root) || root;

const INDEX = RAW.map(({it, cat, sector}) => ({
  it, cat, sector,
  hay:[ it.n, it.a||'', it.k||'', it.do.replace(/<[^>]+>/g,''),
        it.m.flatMap(m => FAMILY.get(ROOT.get(m))).join(' '),   // '경영'으로 적힌 곳도 '경영학'으로 찾히게
        it.ad, cat.name, sector.name ].join(' ').toLowerCase()
}));

function topMajors(items, k){
  const f = new Map();
  items.forEach(it => new Set(it.m.map(m => ROOT.get(m)))
    .forEach(r => f.set(r, (f.get(r)||0)+1)));
  return [...f.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0],'ko')).slice(0,k);
}

const ALL_ITEMS = RAW.map(r => r.it);
const DISTRICTS = new Set(
  ALL_ITEMS.flatMap(it => it.ad.split('·').map(p => p.trim().split(' ')[0]))
           .filter(d => /[구군]$/.test(d)));

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const IMGSRC = [];
const ref = src => { const i = IMGSRC.indexOf(src); return i >= 0 ? i : IMGSRC.push(src) - 1; };

function accentVars(s){

}

function photoStrip(cat, sector){

    </button>`).join('');
  const note = cat.photoNote ? `<p class="strip-note">${esc(cat.photoNote)}</p>` : '';
  return `<div class="strip" style="${accentVars(sector)}">${shots}</div>${note}`;
}

function cardHTML(it, cat, sector){

    </button>

  const majors = it.m.map(m => `<button class="mchip" data-major="${esc(m)}">${esc(m)}</button>`).join('');

function viewSearch(q){
  const needle = q.trim().toLowerCase();
  const hits = INDEX.filter(r => r.hay.includes(needle));
  const byCat = new Map();
  hits.forEach(r => {
    const key = r.sector.id + '/' + r.cat.id;
    if(!byCat.has(key)) byCat.set(key, {sector:r.sector, cat:r.cat, items:[]});
    byCat.get(key).items.push(r.it);
  });

  const groups = [...byCat.values()].map(g => `
    <section class="res-group" style="${accentVars(g.sector)}">
      <div class="ghead">
        <h3>${esc(g.sector.name)} · ${esc(g.cat.name)}</h3>
        <span class="gline"></span>
        <span class="eyebrow">${g.items.length}곳</span>
      </div>
      <ul class="cards">${g.items.map(it=>cardHTML(it,g.cat,g.sector)).join('')}</ul>
    </section>`).join('');

  app.innerHTML = `
  <div class="view">
    ${crumbHTML([{t:'처음', go:''},{t:'검색'}])}
    <div class="res-head">
      <h2><mark>${esc(q)}</mark> 검색 결과</h2>
      <p>${hits.length}곳 · ${byCat.size}개 분야</p>

}

const qInput = document.getElementById('q');
const qClear = document.getElementById('qClear');

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  window.scrollTo({top:0, behavior:'instant'});

  if(h.startsWith('q/')){
    const q = h.slice(2);
    qInput.value = q; qClear.hidden = !q;
    viewSearch(q);
    return;
  }
  qInput.value = ''; qClear.hidden = true;

  if(h === 'sources'){ viewSources(); return; }

  const [sid, cid] = h.split('/');
  const s = SECTORS.find(x => x.id === sid);
  if(!s){ viewHome(); return; }
  const c = s.cats.find(x => x.id === cid);
  if(!c){ viewSector(s); return; }
  viewCategory(s, c);
}

function go(path){
  const next = path ? '#/' + path : '#/';
  if(location.hash === next) route();          // 같은 주소면 hashchange가 안 뜨므로 직접 렌더
  else location.hash = next;
}

document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if(goEl){ go(goEl.dataset.go); return; }

  const mj = e.target.closest('[data-major]');
  if(mj){ go('q/' + encodeURIComponent(mj.dataset.major)); return; }

  const shot = e.target.closest('[data-img]');
  if(shot){
    const src = IMGSRC[+shot.dataset.img];
    openLB(src, shot.dataset.cap + '  ·  ' + creditText(src));
    return;
  }
});

document.getElementById('homeBtn').addEventListener('click', () => go(''));

let qt;
qInput.addEventListener('input', () => {
  qClear.hidden = !qInput.value;
  clearTimeout(qt);
  const v = qInput.value.trim();
  qt = setTimeout(() => {
    if(v.length >= 1) history.replaceState(null,'','#/q/'+encodeURIComponent(v)), viewSearch(v);
    else go('');
  }, 260);
});
qInput.addEventListener('keydown', e => { if(e.key === 'Escape'){ qInput.value=''; qClear.hidden=true; go(''); } });
qClear.addEventListener('click', () => { qInput.value=''; qClear.hidden=true; qInput.focus(); go(''); });

/* ── lightbox ── */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
function openLB(src, cap){
  lbImg.src = src; lbImg.alt = cap || ''; lbCap.textContent = cap || '';
  lb.setAttribute('open',''); document.body.style.overflow = 'hidden';
  document.getElementById('lbClose').focus();
}
function closeLB(){ lb.removeAttribute('open'); document.body.style.overflow = ''; }
document.getElementById('lbClose').addEventListener('click', closeLB);
lb.addEventListener('click', e => { if(e.target === lb) closeLB(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && lb.hasAttribute('open')) closeLB(); });

window.addEventListener('hashchange', route);
route();
</script>
